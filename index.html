<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>施工前・施工後カメラ</title>
<style>
:root{--paper:#EEF0EE;--sheet:#FFF;--ink:#1C2B3A;--soft:#5A6673;--line:#D3D8DC;--gas:#E5AE00;--warn:#B8432C;--ok:#2F7A55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151B21;--sheet:#1E262E;--ink:#E7ECF0;--soft:#9AA6B1;--line:#33404B;--gas:#F2C230;--warn:#E97B63;--ok:#6CC497;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#151B21;--sheet:#1E262E;--ink:#E7ECF0;--soft:#9AA6B1;--line:#33404B;--gas:#F2C230;--warn:#E97B63;--ok:#6CC497;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:21px;margin:0 0 4px;border-left:7px solid var(--gas);padding-left:10px}
.sub{font-size:13px;color:var(--soft);margin:0 0 16px 17px}
h2{font-size:15px;margin:20px 0 8px}
button{font:inherit;font-size:16px;font-weight:800;padding:14px 10px;border:0;cursor:pointer;background:var(--ink);color:var(--paper)}
button.y{background:var(--gas);color:#1C2B3A}
button.o{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button.w{background:transparent;color:var(--warn);border:2px solid var(--warn);font-size:14px;padding:10px}
button,label.btn,.job{touch-action:manipulation;transition:transform .08s,filter .08s}
button:active:not(:disabled),label.btn:active:not(.off),.job:active{transform:scale(.97);filter:brightness(.85)}
button:disabled,label.btn.off{opacity:.35;cursor:default}
label.btn{display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:800;padding:14px 10px;cursor:pointer;background:var(--ink);color:var(--paper);user-select:none}
label.btn.y{background:var(--gas);color:#1C2B3A}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.full{width:100%}
.job{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--gas);padding:10px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-weight:400;color:var(--ink)}
.job.done{border-left-color:var(--ok)}
.job img{width:58px;height:58px;object-fit:cover;flex:none;background:var(--line)}
.job .jt{font-weight:800;font-size:15px;line-height:1.4}
.job .jd{font-size:12.5px;color:var(--soft)}
.st{display:inline-block;font-size:11.5px;font-weight:800;padding:0 7px;margin-left:4px;color:#1C2B3A;background:var(--gas)}
.job.done .st{background:var(--ok);color:#fff}
.empty{color:var(--soft);font-size:14px}
label.f{display:block;font-size:13px;font-weight:700;margin:0 0 4px}
input.t{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);margin-bottom:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.slot{background:var(--sheet);border:2px dashed var(--line);aspect-ratio:3/4;max-width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.slot.has{border-style:solid;border-color:var(--ink)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:0;left:0;z-index:2;font-size:13px;font-weight:800;padding:3px 10px;color:#fff;background:#1C2B3A}
.slot.after .tag{background:var(--gas);color:#1C2B3A}
.slot .ph{font-size:13px;color:var(--soft);text-align:center;padding:0 8px}
.slot .dt{position:absolute;bottom:0;right:0;z-index:2;font-size:11.5px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.links button{font-size:16px;font-weight:800;padding:13px 8px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin:6px 0 12px}
.row button{flex:1;font-size:14px;padding:10px}
.row button.on{background:var(--ink);color:var(--paper)}
.row button:not(.on){background:transparent;color:var(--ink);border:2px solid var(--line)}
#result{display:none;margin-top:6px}
#out{width:100%;height:auto;border:1px solid var(--line);display:block;margin-bottom:10px;cursor:zoom-in}
/* full-screen photo viewer: tap to open, pinch / double-tap to zoom (like Google Photos) */
.viewer{position:fixed;inset:0;background:#000;z-index:70;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.viewer img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;-webkit-user-drag:none;pointer-events:none}
.viewer img.anim{transition:transform .22s ease-out}
.vclose{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:46px;height:46px;border-radius:50%;padding:0;font-size:22px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35);z-index:2}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;background:#2F7A55;color:#fff;font-size:20px;font-weight:800;padding:16px 32px;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 3px #2F7A55,0 10px 30px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap}
.toast.ng{background:#B8432C;box-shadow:0 0 0 3px #B8432C,0 10px 30px rgba(0,0,0,.4)}
.opts{margin:12px 0 4px;display:flex;flex-direction:column;gap:10px}
.opts .ttl{font-size:14px;font-weight:800;color:var(--soft)}
#bSave{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 10px}
#bSave .bsub{font-size:14px;font-weight:700;opacity:.85}
.opts+#bSave{margin-top:8px}
.lay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 8px;border:2px solid var(--line);background:var(--sheet);font-size:17px;white-space:nowrap;font-weight:800;cursor:pointer;touch-action:manipulation}
.opt:has(input:checked){border-color:var(--gas);background:color-mix(in srgb,var(--gas) 16%,var(--sheet))}
.opt input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--gas)}
.opt .ic{display:inline-grid;gap:2px;flex:none}
.opt .ic i{display:block;width:14px;height:10px;background:var(--ink);opacity:.75}
.opt .ic.v{grid-template-rows:10px 10px}.opt .ic.h{grid-template-columns:14px 14px}
.chkrow{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:800;padding:14px 12px;border:2px solid var(--line);background:var(--sheet);cursor:pointer}
.chkrow input{width:26px;height:26px;accent-color:var(--gas);margin:0;flex:none}
.msg{font-size:13px;color:var(--soft);margin:6px 0}
.back{background:transparent;color:var(--ink);padding:6px 0;font-size:14px;margin-bottom:8px}
.note{font-size:12px;color:var(--soft);margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
/* overlay check */
.ov{position:relative;border:1px solid var(--line);background:var(--sheet);margin-bottom:6px;max-width:100%}
.ov img{display:block;width:100%}
.ov img.top{position:absolute;inset:0;height:100%;object-fit:cover}
.ovr{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;margin-bottom:12px}
.ovr input{flex:1;accent-color:var(--gas)}
/* in-page camera (kept for when the viewer allows it) */
.cam{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;color:#fff}
.cam .view{position:relative;flex:1;overflow:hidden}
.cam video,.cam .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .ghost{pointer-events:none}
.grid{position:absolute;inset:0;pointer-events:none;display:none;
 background-image:linear-gradient(to right,transparent calc(33.333% - 1px),rgba(255,255,255,.7) calc(33.333% - 1px),rgba(255,255,255,.7) 33.333%,transparent 33.333%,transparent calc(66.666% - 1px),rgba(255,255,255,.7) calc(66.666% - 1px),rgba(255,255,255,.7) 66.666%,transparent 66.666%),
 linear-gradient(to bottom,transparent calc(33.333% - 1px),rgba(255,255,255,.7) calc(33.333% - 1px),rgba(255,255,255,.7) 33.333%,transparent 33.333%,transparent calc(66.666% - 1px),rgba(255,255,255,.7) calc(66.666% - 1px),rgba(255,255,255,.7) 66.666%,transparent 66.666%)}
.grid::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid rgba(255,255,255,.8);border-radius:50%}
.grid.on{display:block}
/* match frame: green = lined up, yellow = close, red = off, grey = can't compare */
.frame{position:absolute;inset:0;border:10px solid rgba(255,255,255,.35);pointer-events:none;z-index:3;transition:border-color .15s;display:none}
.frame .fl{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:16px;font-weight:800;padding:4px 16px;border-radius:999px;background:rgba(255,255,255,.85);color:#111;white-space:nowrap}
.frame.ok{border-color:#22C55E}.frame.ok .fl{background:#22C55E;color:#04210f}
.frame.near{border-color:#FACC15}.frame.near .fl{background:#FACC15;color:#2b2200}
.frame.far{border-color:#EF4444}.frame.far .fl{background:#EF4444;color:#fff}
.cmask{position:absolute;border:2px dashed rgba(255,255,255,.9);background:rgba(0,0,0,.28);z-index:2;pointer-events:none}
.cmask span,.tmask span{position:absolute;left:4px;top:2px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.tmask{position:absolute;border:2px dashed #FACC15;background:rgba(250,204,21,.12);z-index:1;pointer-events:none}
.diffbox .big.near{color:#FACC15}.diffbox .big.far{color:#FF8A7A}
/* box editor */
.med{position:fixed;inset:0;z-index:60;background:#111;color:#fff;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 0 calc(10px + env(safe-area-inset-bottom,0px))}
.med .mt{margin:0 16px 8px;font-size:16px;font-weight:800;line-height:1.4}
.med .mt small{display:block;font-size:12.5px;font-weight:400;color:#c9d2da}
.mstage{position:relative;flex:1;min-height:0}
#mImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mwrap{position:absolute;overflow:hidden;touch-action:none}
.mrect{position:absolute;border:3px solid #FACC15;background:rgba(250,204,21,.16);box-shadow:0 0 0 9999px rgba(0,0,0,.4)}
.mrect i{position:absolute;width:24px;height:24px;border-radius:50%;background:#FACC15;border:2px solid #111}
.mrect .tl{left:-13px;top:-13px}.mrect .tr{right:-13px;top:-13px}.mrect .bl{left:-13px;bottom:-13px}.mrect .br{right:-13px;bottom:-13px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px 0}
.mbtns .o2{background:transparent;color:#eee;border:2px solid #666;font-size:14px}
.cam .bar{background:#111;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.cam .bar .r{display:flex;align-items:center;gap:10px;font-size:13px}
.cam input[type=range]{flex:1;accent-color:#E5AE00}
.cam .tools{display:flex;gap:8px}
.cam .tools button{flex:1;font-size:12.5px;line-height:1.3;padding:9px 6px;background:#222;color:#eee;border:1px solid #444}
.cam .tools button.on{background:#E5AE00;color:#1C2B3A;border-color:#E5AE00}
.cam .shoot{display:flex;gap:10px}
.cam .shoot button{flex:1}
.cam .shoot .cancel{background:transparent;color:#eee;border:2px solid #666}
.cam .shoot .shot{flex:2}
.diffbox{background:#1C2B3A;color:#fff;padding:10px 12px;margin:4px 0 12px;font-size:13.5px}
.diffbox .big{font-size:16px;font-weight:800;margin-bottom:4px}
.diffbox .big.ok{color:#6CE59E}.diffbox .big.ng{color:#FFD24A}.diffbox .big.na{color:#ddd}

input:focus-visible,button:focus-visible{outline:3px solid var(--gas);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap" id="home">
 <h1>施工前・施工後カメラ</h1>
 <p class="sub">現場ごとに施工前を残して、後日同じ角度で施工後を撮れます</p>
 <button class="y full" id="hNew">新しい現場を始める</button>
 <h2>施工後待ちの現場</h2><div id="lWait"></div>
 <h2>完了した現場</h2><div id="lDone"></div>
 <p class="note">写真はこのスマホのブラウザの中に保存されます(ネットには上がりません)。ブラウザのデータを消すと写真も消えるので、大事な比較写真は「保存する」でスマホにも保存してください。</p>
</div>

<div class="wrap" id="detail" hidden>
 <button class="back" id="dBack">← 現場の一覧へ</button>
 <label class="f" for="site">現場名</label>
 <input class="t" id="site" type="text" placeholder="例:杉並区 ○○様邸 給湯器交換">
 <label class="f" for="memo">メモ(任意)</label>
 <input class="t" id="memo" type="text" placeholder="例:旧機種 → 新機種">
 <div class="pair">
  <div class="slot" id="sB"><span class="tag">施工前</span><span class="ph">まだ撮っていません</span></div>
  <div class="slot after" id="sA"><span class="tag">施工後</span><span class="ph">施工前を撮ると<br>重ねて撮れます</span></div>
 </div>
 <div class="btns">
  <button id="bBefore">施工前を撮る</button>
  <button class="y" id="bAfter" disabled>施工後を撮る</button>
 </div>
 <div class="btns" id="nativeBtns" hidden>
  <label class="btn" id="nBefore" for="fBefore">スマホのカメラで施工前</label>
  <label class="btn y off" id="nAfter" for="fAfter">スマホのカメラで施工後</label>
 </div>
 <button class="o full" id="bMask" disabled style="margin-bottom:8px">交換する機器を枠で囲む(任意)</button>
 <p class="msg" id="camNote" hidden></p>
 <div class="diffbox" id="diffBox" hidden></div>
 <div id="ovBox" hidden>
  <label class="f" for="ovOp">重ねて確認</label>
  <div class="ov"><img id="ovA" alt="施工後の写真"><img class="top" id="ovB" alt="施工前の写真(重ね)"></div>
  <div class="ovr"><span>施工後</span><input type="range" id="ovOp" min="0" max="100" value="50"><span>施工前</span></div>
 </div>
 <div class="links">
  <button id="svB" disabled>施工前の写真を保存</button>
  <button id="svA" disabled>施工後の写真を保存</button>
 </div>
 <div id="result">
  <label class="f" style="margin-top:12px">比較写真(タップで拡大)</label>
  <canvas id="out" role="img" aria-label="施工前と施工後の比較写真"></canvas>
  <div class="opts">
   <span class="ttl">並べ方</span>
   <div class="lay" role="radiogroup" aria-label="並べ方">
    <label class="opt"><input type="radio" name="lay" id="lyV" value="v"><span class="ic v"><i></i><i></i></span>縦に並べる</label>
    <label class="opt"><input type="radio" name="lay" id="lyH" value="h" checked><span class="ic h"><i></i><i></i></span>横に並べる</label>
   </div>
   <label class="chkrow" for="cLabel"><input type="checkbox" id="cLabel" checked>「施工前」「施工後」の文字を入れる</label>
  </div>
  <button class="y full" id="bSave">比較写真を保存する<small class="bsub" id="bSaveSub">横並びで保存されます</small></button>
 </div>
 <p class="msg" id="saveMsg"></p>
 <button class="w full" id="bDel" style="margin-top:24px">この現場を削除</button>
 <input type="file" class="vh" id="fBefore" accept="image/*" capture="environment" tabindex="-1">
 <input type="file" class="vh" id="fAfter" accept="image/*" capture="environment" tabindex="-1" disabled>
</div>

<div class="viewer" id="viewer" hidden><img id="vImg" alt="比較写真(拡大)"><button class="vclose" id="vClose" aria-label="閉じる">✕</button></div>
<div class="toast" id="toast" hidden role="status"></div>

<div class="med" id="med" hidden>
 <p class="mt">交換する機器を枠で囲んでください<small>枠の中は施工前後で比べません。新しい機器が大きくなる場合は、少し大きめに囲んでください。枠の中を引っぱると移動、角の丸で大きさを変えられます。</small></p>
 <div class="mstage" id="mStage"><img id="mImg" alt="施工前の写真"><div class="mwrap" id="mWrap"><div class="mrect" id="mRect"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div></div></div>
 <div class="mbtns"><button class="o2" id="mNone">枠なし(全体で比べる)</button><button class="y" id="mOk">決定</button></div>
</div>

<div class="cam" id="cam">
 <div class="view">
  <video id="vid" playsinline muted autoplay></video>
  <img class="ghost" id="ghost" alt="">
  <div class="grid" id="grid"></div>
  <div class="cmask" id="camMask" hidden><span>比べない</span></div>
  <div class="frame" id="frame"><span class="fl" id="fLabel"></span></div>
 </div>
 <div class="bar">
  <div class="r" id="opRow"><span>重ね具合</span><input type="range" id="op" min="0" max="80" value="35"></div>
  <div class="tools">
   <button id="tGrid">グリッド</button>
   <button id="tGhost" class="on">施工前を重ねる</button>
   <button id="tLine">線で重ねる</button>
   <button id="tDiff" class="on">色で判定</button>
  </div>
  <div class="shoot"><button class="cancel" id="cCancel">やめる</button><button class="y shot" id="cShot">撮影</button></div>
 </div>
</div>
<script type="text/plain" id="alignSrc">
// Alignment search: before photo -> live frame. Inputs are grayscale Float32Arrays (W x H).
// M (optional) is a box {x0,y0,x1,y1} in pixels that is left out of the comparison: the
// equipment being replaced, which looks different before and after.
// Returns {p:{tx,ty,s,r}, score, idScore}: best transform, its match score, and the score
// with no movement at all (how well the overlay lines up right now).
function edges(g,W,H){
 const E=new Float32Array(W*H);
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
  const i=y*W+x;
  const gx=g[i+1]-g[i-1]+0.5*(g[i-W+1]-g[i-W-1]+g[i+W+1]-g[i+W-1]);
  const gy=g[i+W]-g[i-W]+0.5*(g[i+W-1]-g[i-W-1]+g[i+W+1]-g[i-W+1]);
  E[i]=Math.sqrt(gx*gx+gy*gy);
 }
 return blur(blur(E,W,H),W,H);
}
function blur(A,W,H){
 const T=new Float32Array(W*H), O=new Float32Array(W*H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;T[i]=(A[i]+(x>0?A[i-1]:A[i])+(x<W-1?A[i+1]:A[i]))/3;}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;O[i]=(T[i]+(y>0?T[i-W]:T[i])+(y<H-1?T[i+W]:T[i]))/3;}
 return O;
}
function half(A,W,H){
 const w=W>>1,h=H>>1,O=new Float32Array(w*h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=2*y*W+2*x;O[y*w+x]=(A[i]+A[i+1]+A[i+W]+A[i+W+1])/4;}
 return O;
}
function ncc(B,C,W,H,p,M){
 const cx=W/2, cy=H/2, cs=Math.cos(p.r), sn=Math.sin(p.r), is=1/p.s;
 let n=0,sb=0,sc=0,sbb=0,scc=0,sbc=0;
 for(let y=1;y<H-1;y++){
  const yy=y-cy-p.ty;
  for(let x=1;x<W-1;x++){
   const xx=x-cx-p.tx;
   const bx=(cs*xx+sn*yy)*is+cx, by=(-sn*xx+cs*yy)*is+cy;
   const ix=bx|0, iy=by|0;
   if(ix<1||iy<1||ix>=W-2||iy>=H-2)continue;
   if(M&&((x>=M.x0&&x<M.x1&&y>=M.y0&&y<M.y1)||(bx>=M.x0&&bx<M.x1&&by>=M.y0&&by<M.y1)))continue;
   const fx=bx-ix, fy=by-iy, i=iy*W+ix;
   const b=(B[i]*(1-fx)+B[i+1]*fx)*(1-fy)+(B[i+W]*(1-fx)+B[i+W+1]*fx)*fy;
   const c=C[y*W+x];
   n++;sb+=b;sc+=c;sbb+=b*b;scc+=c*c;sbc+=b*c;
  }
 }

 Bgray=grayOf(ctx=>drawCoverTo(ctx,im,im.naturalWidth,im.naturalHeight,AW,AH));
 Bmask=maskPx(job.mask,im.naturalWidth,im.naturalHeight,AW,AH);
 est={tx:0,ty:0,s:1,r:0};estScore=-1;estId=-1;
 if(job.mask){const vw=$("cam").querySelector(".view");placeBox($("camMask"),job.mask,im.naturalWidth,im.naturalHeight,vw.clientWidth,vw.clientHeight);$("camMask").hidden=false;}
 tick(++camGen);
}
async function tick(gen){
 const live=()=>stream&&camMode==="after"&&gen===camGen;
 if(!live())return;
 const v=$("vid");
 if(v.videoWidth&&$("tDiff").classList.contains("on")){
  // Full search on every frame: compares the live view with the before photo from scratch.
  const C=grayOf(ctx=>ctx.drawImage(v,0,0,AW,AH));
  const res=await align({B:Bgray,C,W:AW,H:AH,M:Bmask});
  if(!live())return;
  est=res.p;estScore=res.score;estId=res.idScore;
  showDiff();
 }
 loop=setTimeout(()=>tick(gen),60);
}
function showDiff(){
 const l=levelOf(est,AW,AH,estScore,estId,(job.beforeOri&&oriOK)?ori.beta-job.beforeOri.beta:null);
 // Change colour only after two readings agree, so the frame doesn't flicker.
 if(l===lvlPend)lvlCount++;else{lvlPend=l;lvlCount=1;}
 if(l!==lvlShown&&(lvlShown===null||lvlCount>=2)){
  if(l==="ok"&&lvlShown!==null)vib(60);
  lvlShown=l;setFrame(l,LIVE_LABEL[l]);
 }
}
function diffHtml(l){
 const t={ok:"● 施工前とほぼ同じ位置です",near:"● おしい(少しずれています)",far:"● 施工前とずれています",na:"比べられませんでした(写っている範囲が違いすぎる可能性があります)"}[l];
 return '<div class="big '+l+'">'+t+'</div>';
}
async function photoDiff(){
 const box=$("diffBox");
 if(!(job.before&&job.after)){box.hidden=true;return;}
 box.hidden=false;box.innerHTML='<div class="big na">施工前と比べています…</div>';
 const iB=await loadImg(job.before), iA=await loadImg(job.after);
 const W=AW, H=Math.round(W*iB.naturalHeight/iB.naturalWidth);
 const saveH=AH; AH=H;
 const B=grayOf(ctx=>drawCoverTo(ctx,iB,iB.naturalWidth,iB.naturalHeight,W,H));
 const C=grayOf(ctx=>drawCoverTo(ctx,iA,iA.naturalWidth,iA.naturalHeight,W,H));
 AH=saveH;
 const forJob=job, res=await align({B,C,W,H,M:maskPx(job.mask,iB.naturalWidth,iB.naturalHeight,W,H)});
 if(job!==forJob)return;
 const p={...res.p,W,H};
 const dBeta=(job.beforeOri&&job.afterOri)?job.afterOri.beta-job.beforeOri.beta:null;
 box.innerHTML=diffHtml(levelOf(p,W,H,res.score,res.idScore,dBeta));
}

/* ---------- compose & save ---------- */
function loadImg(b){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=blobUrl(b);});}
function drawCover(ctx,im,x,y,w,h){const iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height, r=Math.max(w/iw,h/ih),sw=w/r,sh=h/r;ctx.drawImage(im,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h);}
// Built automatically whenever both photos exist. makeDone resolves when the
// newest build is finished, so saving never picks up an outdated photo.
let makeSeq=0, makeDone=Promise.resolve();
function make(){makeDone=build();return makeDone;}
async function build(){
 if(!(job&&job.before&&job.after)){$("result").style.display="none";return;}
 const seq=++makeSeq, forJob=job;
 const im=await getImgs();
 if(seq!==makeSeq||job!==forJob)return;
 // Preview: drawn straight onto the page at reduced size, so option changes show at once.
 compose($("out"),0.5,im.b,im.a);
 $("result").style.display="block";
 // Full-size photo for saving / zooming, prepared in the background.
 setTimeout(()=>{if(seq===makeSeq&&job===forJob)fullBlob();},250);
}
// Decoded photos are kept so a rebuild doesn't decode them again.
let imgs={bsrc:null,asrc:null,b:null,a:null};
const decode=async blob=>{try{return await createImageBitmap(blob);}catch(e){return await loadImg(blob);}};
async function getImgs(){
 if(imgs.bsrc!==job.before||imgs.asrc!==job.after){
  const bsrc=job.before, asrc=job.after, [b,a]=await Promise.all([decode(bsrc),decode(asrc)]);
  imgs={bsrc,asrc,b,a};
 }
 return imgs;
}
let full={seq:-1,p:null};
function fullBlob(){
 if(full.seq===makeSeq&&full.p)return full.p;
 const c=document.createElement("canvas");compose(c,1,imgs.b,imgs.a);
 full={seq:makeSeq,p:new Promise(res=>c.toBlob(res,"image/jpeg",0.9))};
 return full.p;
}
// Draws the comparison photo onto canvas c; k scales every size (1 = full size).
function compose(c,k,iB,iA){
 const bw=iB.naturalWidth||iB.width, bh=iB.naturalHeight||iB.height;
 const portrait=bh>=bw, pw=(portrait?900:1200)*k, ph=(portrait?1200:900)*k;
 const gap=12*k,pad=24*k,label=withLabels?64*k:0,foot=(job.site||job.memo)?110*k:pad;
 const W=Math.round(layout==="h"?pad*2+pw*2+gap:pad*2+pw), H=Math.round(layout==="h"?pad+label+ph+foot:pad+(label+ph)*2+gap+foot);
 c.width=W;c.height=H;const x=c.getContext("2d");
 x.fillStyle="#FFFFFF";x.fillRect(0,0,W,H);
 const font='"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif', px=n=>Math.round(n*k)+"px ";
 const cells=[{im:iB,t:"施工前",d:job.beforeAt,x:pad,y:pad,bg:"#1C2B3A",fg:"#FFFFFF"},
  {im:iA,t:"施工後",d:job.afterAt,x:layout==="h"?pad+pw+gap:pad,y:layout==="h"?pad:pad+label+ph+gap,bg:"#E5AE00",fg:"#1C2B3A"}];
 cells.forEach(q=>{
  if(label){x.fillStyle=q.bg;x.fillRect(q.x,q.y,pw,label);x.fillStyle=q.fg;x.textBaseline="middle";
   x.font="800 "+px(38)+font;x.textAlign="left";x.fillText(q.t,q.x+22*k,q.y+label/2+k);
   x.font="600 "+px(28)+font;x.textAlign="right";x.fillText(fmtFull(q.d),q.x+pw-22*k,q.y+label/2+k);x.textAlign="left";}
  drawCover(x,q.im,q.x,q.y+label,pw,ph);});
 if(!(job.site||job.memo))return;
 const fy=H-foot;x.fillStyle="#1C2B3A";x.fillRect(0,fy,W,foot);x.fillStyle="#E5AE00";x.fillRect(0,fy,12*k,foot);
 x.textBaseline="alphabetic";x.fillStyle="#FFFFFF";x.font="700 "+px(36)+font;x.fillText(job.site||job.memo,pad+14*k,fy+48*k,W-pad*2-20*k);
 if(job.site&&job.memo){x.font="500 "+px(28)+font;x.fillStyle="#C9D2DA";x.fillText(job.memo,pad+14*k,fy+88*k,W-pad*2-20*k);}
}
$("cLabel").checked=withLabels;
$("cLabel").onchange=e=>{withLabels=e.target.checked;try{localStorage.setItem("ba-labels",withLabels?"1":"0");}catch(err){}make();};
// The save button says which layout will be saved.
function showLayout(){$("lyV").checked=layout==="v";$("lyH").checked=layout==="h";$("bSaveSub").textContent=layout==="v"?"縦並びで保存されます":"横並びで保存されます";}
showLayout();
document.querySelectorAll('input[name="lay"]').forEach(el=>el.onchange=()=>{layout=el.value;try{localStorage.setItem("ba-lay",layout);}catch(err){}showLayout();make();});
let toastT=null;
function toast(t,ng){const e=$("toast");e.textContent=t;e.classList.toggle("ng",!!ng);e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{e.hidden=true;},2200);}
function saved(ok,msg){$("saveMsg").textContent=msg;toast(ok?"保存しました":msg,!ok);}

/* ---------- photo viewer ---------- */
const vw={s:1,fit:1,x:0,y:0,nw:1,nh:1,pts:new Map(),pinch:null,pan:null,lastTap:0,tapX:0,tapY:0,down:null};
function openViewer(src){const im=$("vImg");$("viewer").hidden=false;im.onload=()=>{vw.nw=im.naturalWidth;vw.nh=im.naturalHeight;im.style.width=vw.nw+"px";im.style.height=vw.nh+"px";vFit(false);};im.src=src;if(im.complete&&im.naturalWidth)im.onload();}
function closeViewer(){$("viewer").hidden=true;vw.pts.clear();vw.pinch=vw.pan=null;}
function vSize(){const v=$("viewer");return [v.clientWidth,v.clientHeight];}
function vFit(anim){const [W,H]=vSize();vw.fit=Math.min(W/vw.nw,H/vw.nh);vw.s=vw.fit;vw.x=(W-vw.nw*vw.s)/2;vw.y=(H-vw.nh*vw.s)/2;vApply(anim);}
function vApply(anim){
 const [W,H]=vSize(), w=vw.nw*vw.s, h=vw.nh*vw.s;
 vw.x=w<=W?(W-w)/2:Math.min(0,Math.max(W-w,vw.x));
 vw.y=h<=H?(H-h)/2:Math.min(0,Math.max(H-h,vw.y));
 const im=$("vImg");im.classList.toggle("anim",!!anim);
 im.style.transform="translate("+vw.x+"px,"+vw.y+"px) scale("+vw.s+")";
}
// Zoom to scale s keeping screen point (px,py) still.
function vZoomAt(s,px,py,anim){const cx=(px-vw.x)/vw.s, cy=(py-vw.y)/vw.s;vw.s=s;vw.x=px-cx*s;vw.y=py-cy*s;vApply(anim);}
const vMax=()=>Math.max(vw.fit*6,1.5);
$("viewer").addEventListener("pointerdown",e=>{
 if(e.target.id==="vClose")return;
 $("viewer").setPointerCapture(e.pointerId);
 vw.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(vw.pts.size===2){
  const [a,b]=[...vw.pts.values()];
  vw.pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:vw.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,x:vw.x,y:vw.y};vw.pan=null;vw.down=null;
 }else if(vw.pts.size===1){
  vw.pan={x0:e.clientX,y0:e.clientY,x:vw.x,y:vw.y};vw.down={x:e.clientX,y:e.clientY,t:performance.now()};
 }
});
$("viewer").addEventListener("pointermove",e=>{
 if(!vw.pts.has(e.pointerId))return;
 vw.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(vw.pinch&&vw.pts.size>=2){
  const [a,b]=[...vw.pts.values()], P=vw.pinch;
  const s=Math.min(vMax(),Math.max(vw.fit*0.8,P.s*Math.hypot(a.x-b.x,a.y-b.y)/P.d));
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, cx=(P.mx-P.x)/P.s, cy=(P.my-P.y)/P.s;
  vw.s=s;vw.x=mx-cx*s;vw.y=my-cy*s;vApply(false);
 }else if(vw.pan){
  vw.x=vw.pan.x+(e.clientX-vw.pan.x0);vw.y=vw.pan.y+(e.clientY-vw.pan.y0);vApply(false);
 }
});
function vUp(e){
 if(!vw.pts.has(e.pointerId))return;
 vw.pts.delete(e.pointerId);
 if(vw.pts.size<2&&vw.pinch){vw.pinch=null;if(vw.s<vw.fit)vFit(true);
  if(vw.pts.size===1){const p=[...vw.pts.values()][0];vw.pan={x0:p.x,y0:p.y,x:vw.x,y:vw.y};}return;}
 if(vw.pts.size===0){
  vw.pan=null;
  const d=vw.down;vw.down=null;
  if(d&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<12&&performance.now()-d.t<300){
   const now=performance.now();
   if(now-vw.lastTap<320&&Math.hypot(e.clientX-vw.tapX,e.clientY-vw.tapY)<40){
    // Double tap: zoom in where tapped, or back to the whole photo.
    vw.lastTap=0;
    if(vw.s>vw.fit*1.05)vFit(true);else vZoomAt(Math.min(vMax(),vw.fit*2.5),e.clientX,e.clientY,true);
   }else{vw.lastTap=now;vw.tapX=e.clientX;vw.tapY=e.clientY;}
  }
 }
}
$("viewer").addEventListener("pointerup",vUp);$("viewer").addEventListener("pointercancel",vUp);
$("viewer").addEventListener("wheel",e=>{e.preventDefault();vZoomAt(Math.min(vMax(),Math.max(vw.fit,vw.s*(e.deltaY<0?1.15:1/1.15))),e.clientX,e.clientY,false);},{passive:false});
$("vClose").onclick=closeViewer;
window.addEventListener("resize",()=>{if(!$("viewer").hidden)vFit(false);});
$("out").onclick=async()=>{await makeDone;if(!imgs.b)return;openViewer(blobUrl(await fullBlob()));};

function stamp(t){const d=new Date(t||Date.now());return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"_"+pad2(d.getHours())+pad2(d.getMinutes());}
async function saveBlob(blob,kind,t){
 const site=(job.site||"").replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,40);
 const name=kind+"_"+(site?site+"_":"")+stamp(t)+".jpg";
 const file=new File([blob],name,{type:"image/jpeg"});
 // Android: save straight to the Download folder (shows up in Google Photos).
 // iPhone etc.: downloads don't reach the photo library, so use the share sheet.
 const android=/Android/i.test(navigator.userAgent);
 if(!android&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file]});$("saveMsg").textContent="共有メニューから「画像を保存」を選ぶと写真アプリに保存されます。";}
  catch(err){if(err&&err.name==="AbortError")$("saveMsg").textContent="保存をやめました。";else saved(false,"保存できませんでした。写真を長押しして保存してください。");}
  return;
 }
 const a=document.createElement("a");a.href=blobUrl(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 saved(true,"保存しました");
}
$("bSave").onclick=async()=>{await makeDone;if(!imgs.b)return;saveBlob(await fullBlob(),"施工前後",Date.now());};
$("svB").onclick=()=>{if(job.before)saveBlob(job.before,"施工前",job.beforeAt);};
$("svA").onclick=()=>{if(job.after)saveBlob(job.after,"施工後",job.afterAt);};

/* ---------- start ---------- */
(async()=>{IDB=await openDB();showHome();})();
</script>
